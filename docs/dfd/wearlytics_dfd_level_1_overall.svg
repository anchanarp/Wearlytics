        <text x="750.0" y="182" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">fetch catalog</text>
        
        <!-- Process 3.0 -->
        <ellipse cx="570" cy="300" rx="70" ry="40" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)"/>
