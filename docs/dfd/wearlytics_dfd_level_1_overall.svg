        <text x="570" y="428" font-size="11" font-weight="700" fill="#2d6a4f" text-anchor="middle">4.0</text>
        <text x="570" y="444" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Weekly</text>
        <text x="570" y="460" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Planner</text>

        <!-- Flow from Login -->
        <path d="M 325 380 C 390 380, 480 440, 500 440" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        
    <!-- Data Store: weekly_plans -->
