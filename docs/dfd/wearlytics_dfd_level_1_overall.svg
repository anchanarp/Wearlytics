      <!-- Label -->
      <text x="962.5" y="445.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">weekly_plans</text>
    </g>
    
        <path d="M 640 431 L 858 431" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="750.0" y="427" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">save daily plan</text>

        <path d="M 860 449 L 645 449" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="750.0" y="462" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">fetch schedule</text>
        
        <!-- Process 5.0 -->
        <ellipse cx="570" cy="580" rx="70" ry="40" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)"/>
        <text x="570" y="568" font-size="11" font-weight="700" fill="#2d6a4f" text-anchor="middle">5.0</text>
        <text x="570" y="584" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Analytics &</text>
        <text x="570" y="600" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Feedback</text>

        <!-- Flow from Login -->
        <path d="M 325 380 C 390 380, 480 580, 500 580" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        
    <!-- Data Store: outfit_feedback -->
    <g class="data-store">
      <!-- Background -->
      <path d="M 1040 562 L 860 562 L 860 598 L 1040 598" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Vertical divider -->
      <line x1="885" y1="562" x2="885" y2="598" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Label -->
      <text x="962.5" y="585.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">outfit_feedback</text>
    </g>
    
        <path d="M 640 571 L 858 571" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="750.0" y="567" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">submit rating</text>

        <path d="M 860 589 L 645 589" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="750.0" y="602" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">view stats</text>
        
        <!-- Process 6.0 -->
        <ellipse cx="570" cy="720" rx="70" ry="40" fill="#ffffff" stroke="#1e293b" stroke-width="1.8" filter="url(#shadow)"/>
        <text x="570" y="708" font-size="11" font-weight="700" fill="#2d6a4f" text-anchor="middle">6.0</text>
        <text x="570" y="724" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Admin</text>
        <text x="570" y="740" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Control</text>

        <!-- Flow from Login -->
