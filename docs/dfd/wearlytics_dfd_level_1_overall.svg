    <!-- Data Store: clothing_items -->
    <g class="data-store">
      <!-- Background -->
      <path d="M 1040 702 L 860 702 L 860 738 L 1040 738" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Vertical divider -->
      <line x1="885" y1="702" x2="885" y2="738" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Label -->
      <text x="962.5" y="725.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">clothing_items</text>
    </g>
    
        <path d="M 640 711 L 858 711" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="750.0" y="707" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">manage presets</text>

        <path d="M 860 729 L 645 729" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="750.0" y="742" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">system audit</text>
