      <!-- Label -->
      <text x="962.5" y="165.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">clothing_items</text>
    </g>
    
        <path d="M 640 151 L 858 151" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
