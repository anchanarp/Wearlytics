    </g>
    
        <path d="M 640 291 L 858 291" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        <text x="750.0" y="287" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">save generated</text>

