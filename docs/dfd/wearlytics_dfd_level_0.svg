<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d6a4f" />
    </marker>
    <!-- Drop shadows for modern presentation -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Academic Report Slide Accent Bars matching reference -->
  <rect x="40" y="25" width="220" height="7" fill="#2d6a4f" rx="2"/>
  <rect x="270" y="25" width="220" height="7" fill="#80b918" rx="2"/>
  <rect x="500" y="25" width="220" height="7" fill="#94a3b8" rx="2"/>

  <!-- Title -->
  <text x="40" y="65" font-size="19" font-weight="800" fill="#1e293b" letter-spacing="1">LEVEL 0 CONTEXT DIAGRAM</text>
  <text x="40" y="88" font-size="13" font-weight="500" fill="#64748b">Wearlytics — AI-Powered Digital Wardrobe & Outfit Recommendation System</text>

    <!-- Process 0.0: Central System -->
    <g class="process">
      <ellipse cx="480" cy="320" rx="115" ry="80" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
      <text x="480" y="308" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">Wearlytics</text>
      <text x="480" y="332" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">System</text>
      <text x="480" y="354" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">(0.0)</text>
    </g>
    
    <!-- Left Entity: Entities sending inputs -->
    <g class="entity">
      <rect x="70" y="245" width="180" height="150" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="4" filter="url(#shadow)"/>
      <text x="160.0" y="285" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">User / Admin</text>
      <line x1="90" y1="297" x2="230" y2="297" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="160.0" y="320" font-size="12" fill="#475569" text-anchor="middle">• Wardrobe Owner</text>
      <text x="160.0" y="342" font-size="12" fill="#475569" text-anchor="middle">• Fashion Client</text>
      <text x="160.0" y="364" font-size="12" fill="#475569" text-anchor="middle">• System Admin</text>
    </g>
    
    <!-- Right Entity: Entities receiving responses -->
    <g class="entity">
      <rect x="710" y="245" width="180" height="150" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="4" filter="url(#shadow)"/>
      <text x="800.0" y="285" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">User / Admin</text>
      <line x1="730" y1="297" x2="870" y2="297" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="800.0" y="320" font-size="12" fill="#475569" text-anchor="middle">• Wardrobe Owner</text>
      <text x="800.0" y="342" font-size="12" fill="#475569" text-anchor="middle">• Fashion Client</text>
      <text x="800.0" y="364" font-size="12" fill="#475569" text-anchor="middle">• System Admin</text>
    </g>
    
    <!-- Request Arrow (User/Admin to System) -->
    <path d="M 250 305 L 357 305" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="290" y="285" width="65" height="20" fill="#ffffff"/>
    <text x="322" y="299" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">request</text>

    <!-- Specific Data Flow Details under arrow -->
    <text x="310" y="340" font-size="11" fill="#475569" text-anchor="middle">[ Credentials, Garment Details,</text>
    <text x="310" y="358" font-size="11" fill="#475569" text-anchor="middle">Styling Filters, Schedule, Feedback ]</text>
    
    <!-- Response Arrow (System to User/Admin) -->
    <path d="M 603 305 L 708 305" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
    <rect x="615" y="285" width="75" height="20" fill="#ffffff"/>
    <text x="652" y="299" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">response</text>

    <!-- Specific Data Flow Details under arrow -->
    <text x="650" y="340" font-size="11" fill="#475569" text-anchor="middle">[ Auth Status, Wardrobe Catalog,</text>
    <text x="650" y="358" font-size="11" fill="#475569" text-anchor="middle">AI Outfits, Weekly Plan, Analytics ]</text>
    </svg>