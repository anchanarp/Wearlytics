<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d6a4f" />
    </marker>
    <!-- Drop shadows for modern presentation -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Academic Report Slide Accent Bars matching reference -->
  <rect x="40" y="25" width="220" height="7" fill="#2d6a4f" rx="2"/>
  <rect x="270" y="25" width="220" height="7" fill="#80b918" rx="2"/>
  <rect x="500" y="25" width="220" height="7" fill="#94a3b8" rx="2"/>

  <!-- Title -->
  <text x="40" y="65" font-size="19" font-weight="800" fill="#1e293b" letter-spacing="1">LEVEL 1 ADMIN</text>
  <text x="40" y="88" font-size="13" font-weight="500" fill="#64748b">Law Firm Management System — Admin Data Flow Diagram</text>

    <!-- External Entity: Admin -->
    <g class="entity">
      <rect x="50" y="310" width="100" height="50" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)"/>
      <text x="100.0" y="340" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Admin</text>
    </g>
    
    <!-- Process: Login -->
    <g class="process">
      <ellipse cx="260" cy="335" rx="55" ry="40" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)"/>
      <text x="260" y="340" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Login</text>
    </g>

    <!-- Admin -> Login -->
    <path d="M 150 335 L 202 335" fill="none" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
    
    <!-- Data Store: login -->
    <g class="data-store">
      <!-- Background -->
      <path d="M 330 470 L 190 470 L 190 504 L 330 504" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Vertical divider -->
      <line x1="215" y1="470" x2="215" y2="504" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Label -->
      <text x="272.5" y="492.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">login</text>
    </g>
    
    <!-- Down arrow: username -->
    <path d="M 235 375 L 235 466" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g transform="translate(225, 425) rotate(-90)">
      <text x="0" y="0" font-size="11" font-weight="500" fill="#334155" text-anchor="middle">username</text>
    </g>

    <!-- Up arrow: password -->
    <path d="M 285 466 L 285 377" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <g transform="translate(295, 425) rotate(90)">
      <text x="0" y="0" font-size="11" font-weight="500" fill="#334155" text-anchor="middle">password</text>
    </g>
    
        <!-- Process: Manage Petitioner -->
        <g class="process">
          <ellipse cx="500" cy="150" rx="65" ry="36" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)"/>
          <text x="500" y="146" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Manage</text>
          <text x="500" y="164" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Petitioner</text>
        </g>

        <!-- Arrow from Login to Process ('valid user') -->
        <path d="M 315 335 L 435 150" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        
        <g transform="translate(365.0, 236.5) rotate(-25)">
          <rect x="-25" y="-7" width="50" height="14" fill="#ffffff" opacity="0.9"/>
          <text x="0" y="4" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">valid user</text>
        </g>
        
    <!-- Data Store: Petitioner -->
    <g class="data-store">
      <!-- Background -->
      <path d="M 890 133 L 720 133 L 720 167 L 890 167" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Vertical divider -->
      <line x1="745" y1="133" x2="745" y2="167" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Label -->
      <text x="817.5" y="155.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Petitioner</text>
    </g>
    
        <!-- add details -->
        <path d="M 567 141 L 718 141" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>
        <text x="642.5" y="137" font-size="10" font-weight="500" fill="#1e293b" text-anchor="middle">add details</text>

        <!-- get details -->
        <path d="M 720 159 L 571 159" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>
        <text x="642.5" y="171" font-size="10" font-weight="500" fill="#1e293b" text-anchor="middle">get details</text>
        
        <!-- Process: Manage Advocate -->
        <g class="process">
          <ellipse cx="500" cy="275" rx="65" ry="36" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)"/>
          <text x="500" y="271" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Manage</text>
          <text x="500" y="289" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Advocate</text>
        </g>

        <!-- Arrow from Login to Process ('valid user') -->
        <path d="M 315 335 L 435 275" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        
        <g transform="translate(365.0, 299.0) rotate(-25)">
          <rect x="-25" y="-7" width="50" height="14" fill="#ffffff" opacity="0.9"/>
          <text x="0" y="4" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">valid user</text>
        </g>
        
    <!-- Data Store: Advocate -->
    <g class="data-store">
      <!-- Background -->
      <path d="M 890 258 L 720 258 L 720 292 L 890 292" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Vertical divider -->
      <line x1="745" y1="258" x2="745" y2="292" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Label -->
      <text x="817.5" y="280.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Advocate</text>
    </g>
    
        <!-- add details -->
        <path d="M 567 266 L 718 266" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>
        <text x="642.5" y="262" font-size="10" font-weight="500" fill="#1e293b" text-anchor="middle">add details</text>

        <!-- get details -->
        <path d="M 720 284 L 571 284" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>
        <text x="642.5" y="296" font-size="10" font-weight="500" fill="#1e293b" text-anchor="middle">get details</text>
        
        <!-- Process: Manage CourtOfficer -->
        <g class="process">
          <ellipse cx="500" cy="400" rx="65" ry="36" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)"/>
          <text x="500" y="396" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Manage</text>
          <text x="500" y="414" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">CourtOfficer</text>
        </g>

        <!-- Arrow from Login to Process ('valid user') -->
        <path d="M 315 335 L 435 400" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        
        <g transform="translate(365.0, 361.5) rotate(12)">
          <rect x="-25" y="-7" width="50" height="14" fill="#ffffff" opacity="0.9"/>
          <text x="0" y="4" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">valid user</text>
        </g>
        
    <!-- Data Store: judge -->
    <g class="data-store">
      <!-- Background -->
      <path d="M 890 383 L 720 383 L 720 417 L 890 417" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Vertical divider -->
      <line x1="745" y1="383" x2="745" y2="417" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Label -->
      <text x="817.5" y="405.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">judge</text>
    </g>
    
        <!-- add details -->
        <path d="M 567 391 L 718 391" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>
        <text x="642.5" y="387" font-size="10" font-weight="500" fill="#1e293b" text-anchor="middle">add details</text>

        <!-- get details -->
        <path d="M 720 409 L 571 409" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>
        <text x="642.5" y="421" font-size="10" font-weight="500" fill="#1e293b" text-anchor="middle">get details</text>
        
        <!-- Process: Complaint Handling -->
        <g class="process">
          <ellipse cx="500" cy="525" rx="65" ry="36" fill="#ffffff" stroke="#1e293b" stroke-width="1.6" filter="url(#shadow)"/>
          <text x="500" y="521" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Complaint</text>
          <text x="500" y="539" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Handling</text>
        </g>

        <!-- Arrow from Login to Process ('valid user') -->
        <path d="M 315 335 L 435 525" fill="none" stroke="#1e293b" stroke-width="1.4" marker-end="url(#arrow)"/>
        
        <g transform="translate(365.0, 424.0) rotate(25)">
          <rect x="-25" y="-7" width="50" height="14" fill="#ffffff" opacity="0.9"/>
          <text x="0" y="4" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">valid user</text>
        </g>
        
    <!-- Data Store: maildetails -->
    <g class="data-store">
      <!-- Background -->
      <path d="M 890 508 L 720 508 L 720 542 L 890 542" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Vertical divider -->
      <line x1="745" y1="508" x2="745" y2="542" stroke="#1e293b" stroke-width="1.6"/>
      <!-- Label -->
      <text x="817.5" y="530.0" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">maildetails</text>
    </g>
    
        <!-- add details -->
        <path d="M 567 516 L 718 516" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>
        <text x="642.5" y="512" font-size="10" font-weight="500" fill="#1e293b" text-anchor="middle">add details</text>

        <!-- get details -->
        <path d="M 720 534 L 571 534" fill="none" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arrow)"/>
        <text x="642.5" y="546" font-size="10" font-weight="500" fill="#1e293b" text-anchor="middle">get details</text>
        </svg>